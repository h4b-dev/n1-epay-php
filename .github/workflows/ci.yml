name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      # A library has no committed lock: resolve the newest dependencies for this PHP version.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Style
        run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests (unit and contract)
        run: vendor/bin/phpunit

      - name: Audit
        run: composer audit

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches CHANGELOG.md and N1co::VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' heading." >&2
            exit 1
          fi
          if ! grep -q "public const VERSION = '${version}';" src/N1co.php; then
            echo "N1co::VERSION is not ${version}." >&2
            exit 1
          fi
          echo "Release ${version} is consistent. Packagist picks the tag up by itself."
